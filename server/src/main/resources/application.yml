server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/daka_footprint?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

jwt:
  # 生产环境务必通过环境变量 JWT_SECRET 提供足够长度的随机密钥
  secret: ${JWT_SECRET:daka-footprint-secret-key-2024-very-long-secret-for-jwt-signing}
  expiration: 86400000

file:
  upload-dir: ${UPLOAD_DIR:./uploads}
